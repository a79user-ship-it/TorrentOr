name: Migrate BitFlow Project

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply cleanup and UI migration
        run: python3 scripts/migrate_bitflow.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration already applied"
            exit 0
          fi
          git commit -m "[cleanup] Clean repo and redesign BitFlow UI"
          git push
