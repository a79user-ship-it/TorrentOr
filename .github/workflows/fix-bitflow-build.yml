name: Fix BitFlow Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Kotlin listener type mismatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/torrentor/MainActivity.kt')
          s = p.read_text()
          old = 'setOnClickListener(action)'
          new = 'setOnClickListener { action() }'
          if old not in s:
              raise SystemExit('Expected listener expression was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/torrentor/MainActivity.kt
          git commit -m "[fix] Correct BitFlow button listener lambda"
          git push
